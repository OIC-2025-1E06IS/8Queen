name: Build 8 Queens GUI

on:
  push:
    branches: [ master ]
    paths:
      - 'GUI/**'
      - '.github/workflows/gui-build.yml'
  pull_request:
    branches: [ master ]
    paths:
      - 'GUI/**'
      - '.github/workflows/gui-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GUI/EightQueenGUI.csproj

      - name: Build
        run: dotnet build GUI/EightQueenGUI.csproj --configuration Release --no-restore
